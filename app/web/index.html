<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Control de gastos, cuentas y servicios en un solo lugar."
    />

    <!-- Brand color: mirrors AppColors.authBackgroundTop in
         app/lib/app/theme/app_colors.dart (also used in manifest.json and in
         the body background below). Update all of them together. -->
    <meta name="theme-color" content="#12291D" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Luma" />
    <!-- iOS fills transparent pixels with black, so it uses the opaque icon. -->
    <link rel="apple-touch-icon" href="icons/Icon-maskable-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Luma</title>
    <link rel="manifest" href="manifest.json" />

    <!-- cropperjs: crop screen used by image_cropper on web -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <style>
      /* Avoids a white flash before Flutter paints its first frame. */
      body {
        background-color: #12291d;
      }

      /* Splash shown until Flutter paints its first frame. Same background
         and leaf size (96px high, centered) as LumaSplash, which takes over
         with the animated leaf, so the hand-off is not visible. */
      #luma-splash {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #12291d;
      }
      #luma-splash img {
        height: 96px;
        width: auto;
        animation: luma-splash-in 400ms ease-out both;
      }
      @keyframes luma-splash-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #luma-splash img { animation: none; }
      }

      /* App accent (#4CBB7A) over the default cropperjs blue. */
      .cropper-view-box {
        outline-color: rgba(76, 187, 122, 0.85);
      }
      .cropper-line,
      .cropper-point,
      .cropper-point.point-se::before {
        background-color: #4cbb7a;
      }
      .cropper-modal {
        background-color: #12291d;
        opacity: 0.7;
      }

      /* Easier to grab crop handles on touch screens: the visible dots grow a
         bit and an invisible ::after widens the touch zone of every handle
         (corners and sides). The default zone is about 5px wide. */
      @media (pointer: coarse) {
        .cropper-point {
          width: 12px;
          height: 12px;
          opacity: 1;
        }
        .cropper-point.point-e { margin-top: -6px; right: -6px; }
        .cropper-point.point-n { margin-left: -6px; top: -6px; }
        .cropper-point.point-w { left: -6px; margin-top: -6px; }
        .cropper-point.point-s { bottom: -6px; margin-left: -6px; }
        .cropper-point.point-ne { right: -6px; top: -6px; }
        .cropper-point.point-nw { left: -6px; top: -6px; }
        .cropper-point.point-sw { bottom: -6px; left: -6px; }
        .cropper-point.point-se {
          bottom: -6px;
          right: -6px;
          width: 12px;
          height: 12px;
        }
        .cropper-point::after {
          content: '';
          position: absolute;
          inset: -14px;
        }
        .cropper-line.line-e::after,
        .cropper-line.line-w::after {
          content: '';
          position: absolute;
          top: 0;
          bottom: 0;
          left: -14px;
          right: -14px;
        }
        .cropper-line.line-n::after,
        .cropper-line.line-s::after {
          content: '';
          position: absolute;
          left: 0;
          right: 0;
          top: -14px;
          bottom: -14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="luma-splash" aria-hidden="true">
      <img src="splash/leaf.png" alt="" />
    </div>
    <script>
      window.addEventListener(
        'flutter-first-frame',
        function () {
          var splash = document.getElementById('luma-splash');
          if (splash) splash.remove();
        },
        { once: true }
      );
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
