name: luma
description: "A new Flutter project."
publish_to: "none"

version: 1.0.1+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.4
  intl: ^0.19.0
  flutter_colorpicker: ^1.1.0
  go_router: ^14.6.2
  pdf: ^3.11.0
  printing: ^5.13.0
  google_sign_in: ^7.2.0
  image_picker: ^1.1.1
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/logo.png
    - assets/images/balance_card_bg.png
    - assets/images/login_bg.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

  uses-material-design: true
