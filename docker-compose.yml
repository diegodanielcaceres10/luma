services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: luma-web
    ports:
      - "4005:4200"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.angular
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4200/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    stdin_open: true
    tty: true
