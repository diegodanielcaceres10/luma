name: Distribute Android (Firebase App Distribution)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comparar versiones
        run: |
          PREVIOUS=$(git show HEAD^:app/pubspec.yaml 2>/dev/null | grep '^version:' | sed 's/version: *//' || true)
          CURRENT=$(grep '^version:' app/pubspec.yaml | sed 's/version: *//')
          if [ -z "$PREVIOUS" ]; then
            echo "⚠️  No hay commit anterior para comparar, se omite el chequeo."
            exit 0
          fi
          chmod +x app/scripts/check_version.sh
          app/scripts/check_version.sh "$PREVIOUS" "$CURRENT"

  build-and-distribute:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Variables públicas (ver README) compiladas dentro del binario con
      # --dart-define-from-file. No incluyas acá secretos "de verdad"
      # (service_role, etc.): eso nunca va en este .env.
      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          EOF

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # Genera android/key.properties (gitignored) que lee android/app/build.gradle
      # para firmar el build de release con el keystore de producción.
      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Build signed release APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: List APK output (debug)
        run: find build/app/outputs/flutter-apk -type f -name "*.apk"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate with service account
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Distribute to testers
        run: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "testers" \
            --release-notes "Distribute by GitHub Actions"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
