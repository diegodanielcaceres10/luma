name: Web PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web_pr_check.yml"

permissions:
  contents: read

concurrency:
  group: web-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Build Angular (SSG)
        run: npx ng build
