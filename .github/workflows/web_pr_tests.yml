name: Web PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web_pr_tests.yml"

permissions:
  contents: read

concurrency:
  group: web-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build Angular (SSG)
        run: npm run build

  version:
    name: Version bump
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The base branch history is needed to read its package.json.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      - name: Check that the version increased
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: npm run check:version -- "$BASE_REF"
