@if (ready() && analytics.consent() === 'unknown') {
  <section
    role="region"
    aria-labelledby="cookie-banner-title"
    class="fixed inset-x-4 bottom-4 z-50 sm:left-auto sm:right-6 sm:bottom-6 sm:max-w-md rounded-2xl border border-white/[0.08] bg-neutral-900/95 p-5 text-neutral-300 shadow-2xl shadow-black/50 backdrop-blur-xl"
  >
    <h2 id="cookie-banner-title" class="font-serif text-base font-semibold text-white mb-1.5">
      Cookies de analítica
    </h2>
    <p class="text-sm leading-relaxed text-neutral-400">
      Usamos Google Analytics para entender cómo se usa este sitio y mejorarlo. Solo se activa si lo
      aceptás, y podés cambiar la decisión cuando quieras desde el pie de página. Más detalles en la
      <a
        routerLink="/privacidad"
        class="text-emerald-400 underline underline-offset-2 hover:text-emerald-300"
        >política de privacidad</a
      >.
    </p>
    <div class="mt-4 grid grid-cols-2 gap-3">
      <button
        type="button"
        (click)="analytics.reject()"
        class="rounded-xl bg-neutral-800 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-neutral-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-400"
      >
        Rechazar
      </button>
      <button
        type="button"
        (click)="analytics.accept()"
        class="rounded-xl bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-neutral-950 transition-colors hover:bg-emerald-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-400"
      >
        Aceptar
      </button>
    </div>
  </section>
}
