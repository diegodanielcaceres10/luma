<header
  class="fixed top-0 left-0 right-0 z-50 border-b border-white/[0.06] bg-neutral-950/70 backdrop-blur-xl transition-all duration-300"
>
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 sm:px-8">
    <!-- Brand Logo & Name -->
    <a routerLink="/" class="group flex items-center gap-3">
      <div
        class="relative flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-emerald-500/20 to-emerald-950/40 p-1.5 ring-1 ring-emerald-500/30 transition-transform duration-300 group-hover:scale-105 group-hover:ring-emerald-400/50"
      >
        <img
          src="logo.webp"
          alt="Luma Logo"
          width="128"
          height="128"
          class="h-full w-full object-contain"
        />
      </div>
      <div class="flex items-baseline gap-2">
        <span
          class="font-serif text-2xl font-bold tracking-tight text-white transition-colors group-hover:text-emerald-400"
        >
          Luma
        </span>
        <span
          class="rounded-full border border-emerald-500/20 bg-emerald-500/10 px-2 py-0.5 text-[10px] font-semibold tracking-wider text-emerald-400"
        >
          v 1.6.0
        </span>
      </div>
    </a>

    <!-- Desktop Navigation Anchors -->
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-neutral-300">
      <a href="#funcionalidades" class="transition-colors hover:text-emerald-400">
        Funcionalidades
      </a>
      <a href="#experiencia" class="transition-colors hover:text-emerald-400"> Experiencia </a>
      <a href="#seguridad" class="transition-colors hover:text-emerald-400">
        Privacidad & Seguridad
      </a>
      <a href="#stack" class="transition-colors hover:text-emerald-400"> Tecnología </a>
    </nav>

    <!-- Desktop Action Buttons -->
    <div class="hidden sm:flex items-center gap-3">
      <a
        href="https://github.com/diegodanielcaceres10/luma"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 rounded-full bg-emerald-500 px-5 py-2 text-xs font-semibold text-neutral-950 shadow-lg shadow-emerald-500/20 transition-all duration-300 hover:bg-emerald-400 hover:shadow-emerald-500/35 hover:scale-[1.02] active:scale-[0.98]"
      >
        <svg class="h-4 w-4 fill-current" viewBox="0 0 24 24">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
          />
        </svg>
        <span>GitHub</span>
        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M14 5l7 7m0 0l-7 7m7-7H3"
          />
        </svg>
      </a>
    </div>

    <!-- Mobile Hamburger Toggle -->
    <button
      type="button"
      (click)="toggleMobileMenu()"
      class="flex md:hidden rounded-lg p-2 text-neutral-400 hover:bg-neutral-800 hover:text-white focus:outline-none"
      aria-label="Abrir menú"
    >
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        @if (!isMobileMenuOpen()) {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        } @else {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        }
      </svg>
    </button>
  </div>

  <!-- Mobile Dropdown Menu -->
  @if (isMobileMenuOpen()) {
    <div
      class="border-b border-neutral-800 bg-neutral-950/95 px-6 py-6 md:hidden backdrop-blur-2xl"
    >
      <div class="flex flex-col gap-4 text-base font-medium text-neutral-300">
        <a (click)="closeMobileMenu()" href="#funcionalidades" class="py-2 hover:text-emerald-400">
          Funcionalidades
        </a>
        <a (click)="closeMobileMenu()" href="#experiencia" class="py-2 hover:text-emerald-400">
          Experiencia
        </a>
        <a (click)="closeMobileMenu()" href="#seguridad" class="py-2 hover:text-emerald-400">
          Privacidad & Seguridad
        </a>
        <a (click)="closeMobileMenu()" href="#stack" class="py-2 hover:text-emerald-400">
          Tecnología
        </a>
        <div class="mt-4 flex flex-col gap-3 pt-4 border-t border-neutral-800">
          <a
            (click)="closeMobileMenu()"
            href="https://github.com/diegodanielcaceres10/luma"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center justify-center gap-2 rounded-xl border border-neutral-800 bg-neutral-900 py-3 text-sm font-medium text-neutral-200"
          >
            Ver código en GitHub
          </a>
        </div>
      </div>
    </div>
  }
</header>
