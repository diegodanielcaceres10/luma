<div aria-hidden="true" class="editorial-bg-root pointer-events-none absolute inset-0 overflow-hidden select-none -z-10">
  <!-- Subtle Grain & Paper-like Tactile Texture -->
  <div class="editorial-grain absolute inset-0 opacity-[0.035] mix-blend-screen"></div>

  <!-- Ambient Light Orbs - Strategic section focal points -->
  <!-- 1. Hero Overhead Halo -->
  <div class="editorial-orb editorial-orb-hero absolute left-1/2 top-0 -translate-x-1/2 -translate-y-1/4 h-[700px] w-[900px] max-w-[95vw] rounded-[100%] bg-[radial-gradient(ellipse_at_center,rgba(5,223,114,0.08)_0%,rgba(0,135,78,0.025)_45%,transparent_75%)] blur-3xl"></div>

  <!-- 2. Transition Aura: Hero to Showcase -->
  <div class="editorial-orb editorial-orb-showcase absolute -right-24 top-[900px] h-[650px] w-[650px] rounded-full bg-[radial-gradient(circle,rgba(20,184,166,0.045)_0%,rgba(5,223,114,0.015)_50%,transparent_70%)] blur-[120px]"></div>

  <!-- 3. Mid-Page Drift: Bento to Experience -->
  <div class="editorial-orb editorial-orb-bento absolute -left-32 top-[1900px] h-[750px] w-[750px] rounded-full bg-[radial-gradient(circle,rgba(5,223,114,0.04)_0%,rgba(4,101,61,0.02)_50%,transparent_70%)] blur-[130px]"></div>

  <!-- 4. Deep Editorial Flow: Gemini & Security -->
  <div class="editorial-orb editorial-orb-security absolute right-0 top-[3100px] h-[800px] w-[700px] rounded-full bg-[radial-gradient(ellipse,rgba(13,148,136,0.035)_0%,rgba(5,223,114,0.015)_45%,transparent_70%)] blur-[140px]"></div>

  <!-- 5. CTA Banner Core Focus -->
  <div class="editorial-orb editorial-orb-cta absolute left-1/2 bottom-12 -translate-x-1/2 h-[600px] w-[850px] max-w-[95vw] rounded-[100%] bg-[radial-gradient(ellipse_at_center,rgba(5,223,114,0.075)_0%,rgba(0,135,78,0.025)_50%,transparent_75%)] blur-3xl"></div>

  <!-- Financial Editorial Topographic & Watermark Curves -->
  <svg class="editorial-contours absolute inset-0 h-full w-full opacity-60" preserveAspectRatio="none" viewBox="0 0 1440 4800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="curve-gradient-1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#05df72" stop-opacity="0.06"/>
        <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.03"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
      </linearGradient>
      <linearGradient id="curve-gradient-2" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.02"/>
        <stop offset="50%" stop-color="#05df72" stop-opacity="0.04"/>
        <stop offset="100%" stop-color="#00874e" stop-opacity="0.01"/>
      </linearGradient>
    </defs>

    <!-- Topographic / Horizon Flow Curves -->
    <path d="M-100 450 C300 350, 600 600, 1100 480 C1300 420, 1500 520, 1600 560" stroke="url(#curve-gradient-1)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="6 4" class="editorial-path"/>
    <path d="M-50 780 C400 900, 850 720, 1200 860 C1400 920, 1550 880, 1650 900" stroke="url(#curve-gradient-2)" stroke-width="1.2" vector-effect="non-scaling-stroke" class="editorial-path"/>

    <!-- Mid Section Curves (Bento / Experience) -->
    <path d="M-120 1600 C250 1450, 750 1750, 1150 1580 C1350 1500, 1520 1620, 1620 1650" stroke="url(#curve-gradient-1)" stroke-width="1" vector-effect="non-scaling-stroke" class="editorial-path"/>
    <path d="M-80 2350 C380 2500, 800 2280, 1250 2420 C1420 2480, 1560 2410, 1660 2440" stroke="url(#curve-gradient-2)" stroke-width="1.2" vector-effect="non-scaling-stroke" stroke-dasharray="8 6" class="editorial-path"/>

    <!-- Lower Section Curves (Gemini / Security / Stack) -->
    <path d="M-100 3250 C300 3100, 720 3400, 1180 3220 C1380 3140, 1520 3280, 1640 3300" stroke="url(#curve-gradient-1)" stroke-width="1" vector-effect="non-scaling-stroke" class="editorial-path"/>
    <path d="M-60 4050 C420 4200, 880 3980, 1280 4120 C1440 4180, 1580 4130, 1680 4150" stroke="url(#curve-gradient-2)" stroke-width="1.2" vector-effect="non-scaling-stroke" class="editorial-path"/>
  </svg>
</div>
