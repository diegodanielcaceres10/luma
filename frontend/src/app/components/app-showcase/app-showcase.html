<section class="relative mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 pb-32">
  <!-- Outer Aura Glow -->
  <div
    class="pointer-events-none absolute inset-x-0 top-1/4 h-96 bg-gradient-to-r from-emerald-500/20 via-teal-500/15 to-emerald-600/10 [mask-image:linear-gradient(to_bottom,transparent,#000_30%,#000_70%,transparent)] -z-10 opacity-70"
  ></div>

  <!-- Device / Interface Frame -->
  <div
    class="relative rounded-3xl border border-white/10 bg-neutral-950/80 p-3 sm:p-5 shadow-2xl shadow-emerald-950/50 backdrop-blur-2xl ring-1 ring-white/5"
  >
    <!-- Top Hardware/Window Bezel -->
    <div class="mb-4 flex items-center justify-between border-b border-white/[0.06] pb-3 px-2">
      <!-- Window dots -->
      <div class="flex items-center gap-2">
        <span class="ml-3 text-xs font-medium text-neutral-400 hidden sm:inline-block"
          >Android App Preview</span
        >
      </div>

      <!-- User & Status Pill -->
      <div class="flex items-center gap-3">
        <div
          class="flex items-center gap-2 rounded-full border border-emerald-500/20 bg-emerald-950/30 px-3 py-1 text-xs text-emerald-300"
        >
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Sincronizado con Supabase</span>
        </div>
      </div>
    </div>

    <!-- Inner Application Dashboard Mockup -->
    <div class="rounded-2xl border border-white/[0.06] bg-neutral-900/60 p-4 sm:p-6 lg:p-8">
      <!-- Real Android screenshots (displayed below native 330px width to stay sharp) -->
      <div
        class="flex snap-x snap-mandatory items-center gap-4 overflow-x-auto pb-2 sm:justify-center sm:gap-6 sm:overflow-visible sm:pb-0"
      >
        <figure class="shrink-0 snap-center text-center">
          <img
            src="screens/screen-login.webp"
            alt="Pantalla de inicio de sesión de Luma con Google"
            width="330"
            height="717"
            loading="lazy"
            class="w-44 rounded-2xl border border-white/10 shadow-xl shadow-emerald-950/40 sm:w-48 lg:w-52"
          />
          <figcaption class="mt-3 text-xs font-medium text-neutral-400">Acceso</figcaption>
        </figure>

        <figure class="shrink-0 snap-center text-center">
          <img
            src="screens/screen-home.webp"
            alt="Pantalla de inicio de Luma con balance del mes y últimos movimientos"
            width="330"
            height="717"
            loading="lazy"
            class="w-48 rounded-2xl border border-emerald-500/30 shadow-2xl shadow-emerald-500/20 sm:w-56 lg:w-60"
          />
          <figcaption class="mt-3 text-xs font-medium text-emerald-300">Inicio</figcaption>
        </figure>

        <figure class="shrink-0 snap-center text-center">
          <img
            src="screens/screen-charts.webp"
            alt="Pantalla de estadísticas de Luma con gastos por categoría"
            width="330"
            height="717"
            loading="lazy"
            class="w-44 rounded-2xl border border-white/10 shadow-xl shadow-emerald-950/40 sm:w-48 lg:w-52"
          />
          <figcaption class="mt-3 text-xs font-medium text-neutral-400">Estadísticas</figcaption>
        </figure>
      </div>
    </div>
  </div>
</section>
